# EXAMPLE ONLY — replace image, secrets, and host before apply.
# Do not put real credentials in this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a6-app
  namespace: a6
spec:
  replicas: 2
  selector:
    matchLabels:
      app: a6-app
  template:
    metadata:
      labels:
        app: a6-app
    spec:
      containers:
        - name: app
          image: ghcr.io/cenkut/a6comtr:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: a6-app
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: a6-app
  namespace: a6
spec:
  selector:
    app: a6-app
  ports:
    - port: 80
      targetPort: 3000
